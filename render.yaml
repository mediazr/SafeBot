services:
  - type: web
    name: safebot-safedata-ops
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SAFEDATAOPS_API_URL
        value: https://safedataops.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
